# Коэффициенты основного оценщика решения — baseline_estimator.py (описание модели — docs/model.md).
# Нода передаёт их как config['baseline_coefficients'] (параметр baseline_coefficients_file).
# config/params.yaml — паспортные коэффициенты вагона для альтернативного оценщика, на этот файл не влияет.

# --- перевод сырых показаний тележек в м/с ---
# В записях скорость тележек в км/ч (отношение к эталону 3.60). Поправка масштаба колеса
# откалибрована по 57 обучающим записям 30618 (RTK GNSS + карта, tools/calib_scale.py):
# медиана 1.00034 (разброс между поездками ~0.1%).
velocity_scale: 0.27787222            # = 1.00034 / 3.6
velocity_scale_by_vehicle:            # выбирается параметром ноды vehicle_id
  "30618": 0.27787222                 # 1.00034 / 3.6
  "30639": 0.27848333                 # 1.00254 / 3.6 (7 записей, менее надёжно)

# --- слияние двух тележек / проскальзывание ---
bogie_stale_sec: 0.6        # показание тележки старше — не используется
bogie_calibration: true     # раздельная калибровка тележек: отношение передняя/задняя уточняется на ходу
bogie_ratio_by_vehicle:     # начальное отношение передняя/задняя (медиана по обучающим записям на чистых участках)
  '30618': 1.0000
  '30639': 0.9997
bogie_ratio_tau_sec: 200.0  # память оценки отношения (по времени чистых синхронных пар)
bogie_ratio_max: 0.03       # предел |ln(отношения)|
gate_abs: 0.4               # м/с — строб согласия показания с прогнозом
gate_per_sec: 2.0           # м/с на секунду с прошлого обновления
resync_sec: 1.0             # тележки согласны между собой, но вне строба дольше — доверяем им
max_traction_accel: 1.8     # м/с^2 — физический предел разгона (выше = боксование)
max_brake_decel: 3.2        # м/с^2 — предел замедления (выше = юз)
slip_diff_abs: 0.5          # м/с — расхождение тележек «согласны/нет»
slip_diff_rel: 0.08
adhesion_nominal: 0.25      # номинальный коэффициент сцепления (сухой рельс)
max_speed: 25.0             # м/с

# --- модель тяги/торможения a(позиция контроллера, v) по обучающим записям ---
# (tools/fit_traction_table.py; используется при пропаже колёсных данных и в прогнозе)
traction_lag_sec: 0.2       # запаздывание отклика привода на позицию контроллера
# traction_table / traction_v_bins — если не заданы, берётся таблица, зашитая в baseline_estimator.py
traction_use_grade: true    # a = A_ровн(u, v) - g*sin(уклон по карте); false — таблица «как есть»
                            # (tools/fit_traction_grade.py: остаток 0.202 против 0.221 м/с²)

# --- измеренное ускорение и строб согласия тележек ---
accel_filter_tau_sec: 0.4   # сглаживание ускорения (наклон скорости по времени измерений, без потерь)
accel_min_dt_sec: 0.04
gate_model_margin: 0.3      # м/с² — прогноз строба: измеренное ускорение в пределах модель ± запас
                            # (разгон/замедление сверх позиции ручки — проскальзывание, строб за ним не идёт)

# --- проскальзывание обеих тележек: ускорение колёс против модели по ручке (docs/model.md) ---
slip_accel_check: true              # детектор проскальзывания обеих тележек по модели
slip_accel_threshold_min: 0.4       # м/с² — порог невязки не ниже этого
slip_accel_k_sigma: 4.0             # ... и не ниже k·σ невязки на обычной езде (σ оценивается на ходу)
slip_accel_spread_margin: 0.1       # ... и не ниже коридора ячейки traction_spread_table + запас
slip_accel_persist_sec: 0.25        # подозрение должно держаться
slip_accel_max_sec: 6.0             # дольше по модели не идём — возвращаемся к колёсам
slip_accel_min_speed: 2.0           # м/с
slip_accel_tau_sec: 0.3             # сглаживание ускорения колёс

# --- адаптация модели на ходу (загрузка/масса, состояние привода): a = k·A_ровн(u, v) − g·sin(уклон) ---
model_adapt: true                   # РМНК с забыванием отдельно для тяги и торможения (Vahidi et al., 2005)
model_adapt_tau_sec: 90.0           # память ~1.5 мин
model_adapt_min: 0.6                # пределы множителя
model_adapt_max: 1.5
model_adapt_min_accel: 0.2          # м/с² — обновлять, только когда модель даёт заметное ускорение
model_adapt_noise: 0.2              # м/с² — шум измеренного ускорения
model_adapt_hold_sec: 1.0           # позиция ручки держится не меньше (отклик установился)
model_adapt_reset_stop_sec: 60.0    # после такой стоянки уверенность снижается (другая загрузка)

# --- проверка колёс по модели тяги (боксование ОБЕИХ тележек под тягой), старый вариант ---
slip_model_check: false             # по умолчанию выкл.: на реальных данных пользы нет, а ошибки высот карты дают ложные срабатывания
slip_model_threshold_traction: 0.5  # м/с — колёса разгоняются быстрее модели на столько за окно
slip_model_threshold_brake: 0.0     # 0 — юз по модели не ищем (модель торможения неточна)
slip_model_window_sec: 1.0
slip_model_max_sec: 4.0             # дольше не держим — возвращаемся к колёсам
slip_model_min_speed: 2.0
slip_model_min_notch: 3

# --- ветки, которых нет в графе путей (branch_map_files ноды: maps/tallinskaya_middle.json) ---
branch_blend: true              # после стрелки положение = (1 − p)·основной путь + p·ветка, дисперсия += p(1 − p)·d²
branch_stand_tau_sec: 15.0      # на стоянке вес ветки убывает: долго в этой зоне стоят только на петле (отстой до 5 мин)
# branch_probability: 0.15      # по умолчанию — из файла ветки (3 из 25 обучающих проездов через стрелку, сглаживание Лапласа)

# --- продольные ориентиры: места остановок (maps/stop_landmarks.json) ---
stop_landmark_min_sec: 5.0      # остановка не короче — ищем ориентир
stop_landmark_gate_max: 8.0     # м — предельный строб поиска ориентира
stop_landmark_sigma_min: 0.3    # м — минимальная погрешность ориентира
stop_landmark_sigma_mode: std   # погрешность места: std (с учётом редких остановок в 1–2 м) или mad
stop_landmark_min_n: 4          # ориентир построен не менее чем по стольким остановкам
stop_landmark_ambiguity: 10.0   # ориентир должен быть во столько раз вероятнее остальных в стробе
along_track_drift_rate: 0.0015  # рост продольной неопределённости, м на м пути (без самокалибровки)
reconstructed_map_files: [terminal_loops]   # пути, восстановленные по GNSS (менее точная длина)
reconstructed_path_noise: 0.0   # м²/м — доп. рост продольной дисперсии на таких путях (0: в петлях
                                # часты остановки в очереди рядом с ориентирами — широкий строб вреден)

# --- грубая ошибка масштаба колёс (03.09: +0.6 % днём, +1.4–1.6 % утром) ---
scale_anomaly_detect: true      # два интервала подряд между принятыми ориентирами с уходом > 0.3 %
scale_anomaly_threshold: 0.003
scale_anomaly_min_interval: 150.0
scale_anomaly_max_slip_sec: 1.0   # на интервале было проскальзывание дольше — интервал не в счёт (уход пути из-за него)
scale_ransac: true              # серия остановок против ориентиров (когда ориентиры уже вне строба)
scale_ransac_min_inliers: 4     # остановок у ориентиров под одной гипотезой (3 — если размах >= long_span)
scale_ransac_min_rate: 0.0035   # срабатывает при ошибке масштаба больше 0.35 %
scale_ransac_tolerance: 1.2     # м — остановка «у ориентира» при такой невязке
scale_ransac_min_span: 500.0    # м пути между крайними такими остановками
scale_ransac_long_span: 2000.0
# (в петлях у конечных остановки в очереди — для этого не используются)

# --- самокалибровка масштаба колёс по ориентирам (фильтр Калмана [ошибка пути, масштаба]) ---
scale_learning: false
scale_sigma0: 0.003             # априорный разброс масштаба между поездками (0.3 %)
scale_max_dev: 0.025            # предел поправки масштаба (±2.5 %; 03.09 утром было +1.6 %)
along_track_noise: 0.00025      # м²/м — случайная продольная ошибка (буксование и т.п.)
scale_noise: 1.0e-11            # 1/м — дрейф масштаба в поездке

# --- выход ---
output_delay_sec: 0.0       # сдвиг оценки положения во времени (0 — оптимум по проверочной записи)
velocity_delay_sec: 0.03    # скорость на выходе берётся на 30 мс раньше (эталон слегка запаздывает)
velocity_output_tau_sec: 0.0  # доп. сглаживание скорости на выходе (0 — выкл.)
max_extrapolation_sec: 30.0 # максимум прогноза без входов

# --- привязка к карте на старте ---
map_match_max_dist: 12.0    # м — дальше от путей карты считаем, что стоим вне карты
gnss_weight_master: 1.0     # антенна master точнее (в т.ч. при status 0 — проверочная запись: 0.15 м)
gnss_weight_rover: 0.15     # rover шумнее (смещения 1-2 м даже при status 2): для курса и как запасной
gnss_weight_status0: 0.7    # множитель веса фикса со status=0 (не RTK) относительно status=2
gnss_weight_status1: 0.02   # status=1 (SBAS) в данных смещён на ~8 м

