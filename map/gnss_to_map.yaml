# Перевод GNSS (NavSatFix: latitude, longitude, altitude) в координаты карты pathgraph.
# Реализация: tools/geo.py (lla_to_map — без numpy, можно импортировать в ноду).
projection:
  type: utm            # поперечная Меркатора, эллипсоид WGS84
  zone: 37             # северное полушарие, центральный меридиан 39° в. д.
  scale_factor: 0.9996
  false_easting: 500000.0
map_offset:            # x = easting - x, y = northing - y (угол квадрата MGRS)
  x: 300000.0
  y: 6100000.0
z: altitude            # z карты = высота GNSS как есть; рельс = антенна - 3.0 м
antennas_in_base_link: # м; x вперёд, y влево, z вверх (данные организаторов)
  rover:  [2.563, 0.0, 3.0]    # передняя антенна
  master: [-9.873, 0.0, 3.0]   # задняя антенна
antenna_baseline_m: 12.436
bogie_distance_m: 7.55
# Проверка на записях 30618 (статус 2, участки на карте): расстояние от точки до линии карты —
# медиана 0.05-0.09 м, 90-й процентиль 0.1-0.4 м; (высота антенны - 3 м) - z карты ~ 0.1 м.
